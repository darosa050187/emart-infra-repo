apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: emart-mongo-pvc-claim
  labels:
    app: emart-mongo-pvc-claim
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
    limits:
      storage: 3Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: emart-mysql-pvc-claim
  labels:
    app: emart-mysql-pvc-claim
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
    limits:
      storage: 3Gi
  storageClassName: standard
