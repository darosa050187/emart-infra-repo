apiVersion: apps/v1
kind: Deployment
metadata:
  name: emart-api-deployment
  labels:
    app: emart-api-repository #0001 - Match this two togheter to explicitly tight them
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emart-api-repository #0001 - Match this two togheter to explicitly tight them
  template:
    metadata:
      labels:
        app: emart-api-repository #0001 - Match this two togheter to explicitly tight them
    spec:
      containers:
      - name: emart-api-repository
        image: 084828572941.dkr.ecr.us-east-1.amazonaws.com/emart-emartapi-repository:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
      imagePullSecrets:
      - name: aws-ecr-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: emart-api-service
spec:
  selector:
    app: emart-api-repository   #0001 - Match this two togheter to explicitly tight them
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP