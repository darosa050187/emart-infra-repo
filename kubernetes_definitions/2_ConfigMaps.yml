apiVersion: v1
kind: ConfigMap
metadata:
  name: emart-mongo-configmap
  labels:
    app: emartapp-cm-mongo
data:
  MONGO_INITDB_DATABASE: epoc
  storageSize: 3Gi
  storageClassName: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: emart-sql-configmap
data:
  init.sql:
    CREATE DATABASE IF NOT EXISTS books;
    USE books;
    CREATE TABLE IF NOT EXISTS books (
      id INT AUTO_INCREMENT PRIMARY KEY,
      title VARCHAR(255) NOT NULL,
      author VARCHAR(255) NOT NULL,
      category VARCHAR(255) NOT NULL,
      publisher VARCHAR(255) NOT NULL,
      publish_date DATE NOT NULL,
      pages INT NOT NULL,
      language VARCHAR(255) NOT NULL,
      description TEXT NOT NULL,
      price DECIMAL(10, 2) NOT NULL,
      image_url VARCHAR(255) NOT NULL,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
    );
    -- Grant permissions
    GRANT ALL PRIVILEGES ON books.* TO 'root'@'%';
    FLUSH PRIVILEGES;
  labels:
    app: emartapp-cm-mysql
data:
  database_url: emartdb
  database_port: "3306"
  database_name: books
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: emart-nginx-config
data:
  default.conf: 
    upstream client {
        server emart-client-service:4200;
    }
    server {
        listen 80;
        server_name localhost;
        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme; 

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_pass http://emart-client-service:4200;
        }
        location /emart-api-service {
            proxy_pass http://emart-api-service:5000;
        }
        location /emart-book-service {
            proxy_pass http://emart-book-service:9000;
        }
    }